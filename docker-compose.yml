services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    command: sh -c "npx prisma db push && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
      - ./prisma:/app/prisma
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
